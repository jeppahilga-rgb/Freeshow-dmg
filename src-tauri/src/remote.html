<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeShow Remote</title><style>body{background:#171821;color:#eee;font:18px system-ui;margin:20px;max-width:900px}button,input{font:inherit;padding:14px;margin:5px;border-radius:6px;border:1px solid #555;color:#eee;background:#252933}button{cursor:pointer}button.active{border-color:#ff0099}#shows,#slides{display:flex;flex-wrap:wrap}#status{color:#aaa}input{max-width:80%}</style></head><body><h1>FreeShow Remote</h1><p id="status">Connecting…</p><form id="auth" hidden><input id="password" type="password" placeholder="Remote password" autocomplete="current-password"><button>Connect</button></form><div id="controls" hidden><button id="previous">Previous</button><button id="next">Next</button><button id="clear">Clear output</button><button id="refresh">Refresh</button><h2 id="title">Choose a show</h2><div id="slides"></div><h2>Shows</h2><input id="search" placeholder="Search shows"><div id="shows"></div></div><script>
const token=new URL(location.href).searchParams.get('token');let id='',shows={},selected='',index=0,count=0;
const el=id=>document.getElementById(id);async function api(path,data){const r=await fetch('/'+path+'?token='+encodeURIComponent(token)+(id?'&id='+encodeURIComponent(id):''),data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json()}
const send=(channel,data=null)=>api('message',{channel,data});
function ready(){el('auth').hidden=true;el('controls').hidden=false;el('status').textContent='Connected on the local network'}
function renderShows(){el('shows').replaceChildren();Object.entries(shows).filter(([key,s])=>!s.private&&s.name?.toLowerCase().includes(el('search').value.toLowerCase())).sort((a,b)=>a[1].name.localeCompare(b[1].name)).forEach(([key,s])=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>{selected=key;send('SHOW',key).catch(fail)};el('shows').append(b)})}
function renderShow(show){selected=show.id||selected;el('title').textContent=show.name||'Show';el('slides').replaceChildren();const layout=show.layouts?.[show.settings?.activeLayout]||Object.values(show.layouts||{})[0];let refs=[];for(const slide of layout?.slides||[]){refs.push(slide.id);refs.push(...(show.slides?.[slide.id]?.children||[]))}if(!refs.length)refs=Object.keys(show.slides||{});count=refs.length;refs.forEach((key,n)=>{const b=document.createElement('button');b.textContent=(n+1)+'. '+(show.slides?.[key]?.group||'Slide');b.onclick=()=>present(n);el('slides').append(b)})}
function present(n){if(!selected)return;index=Math.max(0,Math.min(count-1,n));send('OUT',{id:selected,index}).catch(fail);[...el('slides').children].forEach((b,n)=>b.classList.toggle('active',n===index))}
function receive(m){if(m.channel==='PASSWORD'){if(m.data?.password){el('auth').hidden=false;el('status').textContent='Enter the FreeShow remote password'}}else if(m.channel==='ERROR'){el('status').textContent='Incorrect password';el('auth').hidden=false}else if(m.channel==='SHOWS'){shows=m.data||{};ready();renderShows()}else if(m.channel==='SHOW'&&m.data){ready();renderShow(m.data)}}
function fail(e){el('status').textContent=e.message||String(e)}
el('auth').onsubmit=e=>{e.preventDefault();send('ACCESS',el('password').value).catch(fail)};el('search').oninput=renderShows;el('previous').onclick=()=>present(index-1);el('next').onclick=()=>present(index+1);el('clear').onclick=()=>send('OUT','clear').catch(fail);el('refresh').onclick=()=>send('PASSWORD').catch(fail);
(async()=>{try{id=(await api('connect',{})).id;await send('PASSWORD');while(true){try{for(const m of await api('poll'))receive(m)}catch(e){fail(e)}await new Promise(r=>setTimeout(r,300))}}catch(e){fail(e)}})();
</script></body></html>
