[package]
name = "freeshow-tauri"
version = "1.6.7-beta.1"
edition = "2021"
license = "GPL-3.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
axum = "0.8"
socketioxide = { version = "0.18", features = ["v4"] }
include_dir = "0.7"
base64 = "0.22"
rosc = "0.11.4"
lofty = "0.25.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"



[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
objc2-web-kit = { version = "0.3", features = ["WKPDFConfiguration", "WKSnapshotConfiguration", "block2"] }
block2 = "0.6"
